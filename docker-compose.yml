services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  api:
    build: ./apps/api
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      - redis
  worker:
    build: ./apps/api
    command: uv run arq app.worker.tasks.WorkerSettings
    env_file: .env
    depends_on:
      - redis
  web:
    build: ./apps/web
    env_file: .env
    ports:
      - "3000:3000"
    depends_on:
      - api
