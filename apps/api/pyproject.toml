[project]
name = "apf-api"
version = "0.1.0"
description = "Autonomous Product Factory API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "supabase>=2.9.0",
    "anthropic>=0.39.0",
    "langgraph>=0.2.0",
    "langgraph-checkpoint-postgres>=0.1.0",
    "arq>=0.26.0",
    "asyncpg>=0.30.0",
    "redis>=5.2.0",
    "sse-starlette>=2.1.0",
    "stripe>=10.0.0",
    "slowapi>=0.1.9",
    "sentry-sdk[fastapi]>=2.14.0",
    "structlog>=24.1.0",
    "e2b-code-interpreter>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
